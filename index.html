<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f2ea" />
    <title>INKLANDS</title>
    <!-- No web fonts, no images: every word the player reads is
         hand-lettered by the stroke library at runtime, and even the
         tab's icon is drawn by the pen when the page opens (see
         installFavicon in src/ui/lettering.ts). The font stacks in
         style.css are an accessibility fallback only. -->
    <!-- PEN: an empty icon, so the browser never asks for /favicon.ico
         (a 404 on every load) before the pen has drawn the real one -->
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script type="module">
      import { installFavicon } from '/src/ui/lettering.ts';
      installFavicon();
    </script>
  </body>
</html>
